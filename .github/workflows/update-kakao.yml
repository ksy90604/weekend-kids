name: 카카오 지도 장소 수집

on:
  schedule:
    - cron: "0 19 * * 6"   # 매주 일요일 새벽 4시 (한국시간)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 키즈카페·체험농장 등 검색 수집
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python scripts/fetch_kakao.py

      - name: 바뀐 내용 커밋
        run: |
          if git diff --quiet -- data/kakao-places.json; then
            echo "바뀐 내용 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase -q origin main || true
          git add data/kakao-places.json
          git commit -m "카카오 지도 장소 수집 $(TZ=Asia/Seoul date +'%Y-%m-%d')"
          git push
