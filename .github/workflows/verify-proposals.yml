name: 장소 제안 검증·등록

on:
  schedule:
    - cron: "30 */6 * * *"   # 6시간마다
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 제안 검증 (카카오 지도 검색)
        env:
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: python scripts/verify_proposals.py

      - name: 바뀐 내용 커밋
        run: |
          if git diff --quiet -- data/custom-places.json data/proposals-status.json; then
            echo "바뀐 내용 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase -q origin main || true
          git add data/custom-places.json data/proposals-status.json
          git commit -m "장소 제안 검증 결과 반영 $(TZ=Asia/Seoul date +'%Y-%m-%d %H:%M')"
          git push
