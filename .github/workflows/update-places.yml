name: 장소 데이터 갱신

on:
  schedule:
    - cron: "0 18 * * *"   # 매일 새벽 3시 (한국시간)
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: update-places
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: TourAPI에서 장소 받기
        env:
          TOUR_API_KEY: ${{ secrets.TOUR_API_KEY }}
        run: python scripts/fetch_places.py

      - name: 바뀐 내용 커밋
        run: |
          if git diff --quiet -- data/places.json; then
            echo "바뀐 내용 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places.json
          git commit -m "장소 데이터 자동 갱신 $(TZ=Asia/Seoul date +'%Y-%m-%d')"
          git push
